apiVersion: v1
kind: ConfigMap
metadata:
  name: hosybook-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  hosybook.json: |
    {
      "title": "HosyBook",
      "uid": "hosybook",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Requests per second",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_requests_total{job=\"backend\",handler!=\"/metrics\"}[1m])) by (handler)",
              "legendFormat": "{{handler}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "p95 latency",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=\"backend\",handler!=\"/metrics\"}[5m])) by (le, handler))",
              "legendFormat": "{{handler}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Error rate (4xx + 5xx)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_requests_total{job=\"backend\",status=~\"4xx|5xx\"}[5m])) by (status)",
              "legendFormat": "{{status}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Bookings in last 1h",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 6,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(http_requests_total{job=\"backend\",handler=\"/api/appointments\",method=\"POST\",status=\"2xx\"}[1h]))",
              "legendFormat": "bookings"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Backend pods up",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 18,
            "y": 8,
            "w": 6,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(up{job=\"backend\"})",
              "legendFormat": "pods"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          }
        }
      ]
    }
