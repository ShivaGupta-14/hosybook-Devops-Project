apiVersion: apps/v1
kind: Deployment
metadata:
  name: hosybook-backend
  labels:
    app: hosybook-backend
    {{- include "hosybook.labels" . | nindent 4 }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: hosybook-backend
  template:
    metadata:
      labels:
        app: hosybook-backend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image }}:{{ .Values.backend.tag }}"
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hosybook-postgres
                  key: url
            - name: TZ
              value: Asia/Kolkata
          startupProbe:
            httpGet: {path: /health, port: 8000}
            failureThreshold: 40
            periodSeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
