apiVersion: apps/v1
kind: Deployment
metadata:
  name: hosybook-frontend
  labels:
    app: hosybook-frontend
    {{- include "hosybook.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: hosybook-frontend
  template:
    metadata:
      labels:
        app: hosybook-frontend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image }}:{{ .Values.frontend.tag }}"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /, port: 8080}
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: {path: /, port: 8080}
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
