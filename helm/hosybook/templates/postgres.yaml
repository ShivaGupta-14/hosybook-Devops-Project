apiVersion: v1
kind: Secret
metadata:
  name: hosybook-postgres
type: Opaque
stringData:
  username: {{ .Values.postgres.username | quote }}
  password: {{ .Values.postgres.password | quote }}
  url: {{ include "hosybook.dbUrl" . | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hosybook-postgres-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hosybook-postgres
  labels:
    app: hosybook-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hosybook-postgres
  template:
    metadata:
      labels:
        app: hosybook-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: hosybook-postgres, key: username}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: hosybook-postgres, key: password}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hosybook-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: hosybook-postgres
spec:
  type: ClusterIP
  selector:
    app: hosybook-postgres
  ports:
    - port: 5432
      targetPort: 5432
