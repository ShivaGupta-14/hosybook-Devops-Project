services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hosybook
      POSTGRES_USER: hosybook
      POSTGRES_PASSWORD: hosybook
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hosybook -d hosybook"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://hosybook:hosybook@postgres:5432/hosybook
      TZ: Asia/Kolkata
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:8080"

volumes:
  pgdata:
